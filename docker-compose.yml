name: conduit-speckit

services:
  postgres:
    image: postgres:16-alpine
    container_name: conduit-speckit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conduit-speckit}
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - conduit-speckit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conduit-speckit-postgres-data:
    name: conduit-speckit-postgres-data
