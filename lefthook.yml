# Git hooks via Lefthook.
#
# Les contrôles rapides protègent chaque commit; la validation complète reste
# en pre-push pour conserver un commit local rapide.

pre-commit:
  parallel: true
  commands:
    format:
      run: ./mvnw spotless:check
    checkstyle:
      run: ./mvnw checkstyle:check
    secrets:
      run: gitleaks git --config .gitleaks.toml

pre-push:
  parallel: false
  commands:
    verify:
      run: ./mvnw verify -P integration
