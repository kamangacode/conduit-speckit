spring:
  application:
    name: conduit
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/conduit-speckit}
    username: ${DATABASE_USERNAME:conduit}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
conduit:
  jwt:
    secret: ${JWT_SECRET}
